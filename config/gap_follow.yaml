gap_follow:
  gap_follow:
    ros__parameters:
      # ============================================================
      # 주행 방향 핵심 튜닝
      # 방향 선택 문제가 있을 때는 우선 이 네 값만 조정
      # ============================================================

      # 0: 깊게 열린 방향 우선 / 1: 주변까지 넓은 방향 우선
      gap_width_preference: 0.4

      # 이 거리보다 먼 LiDAR 값은 gap 점수에서 동일하게 취급
      gap_score_distance_cap: 5.0

      # 선택한 gap과 반대쪽 gap의 점수 차이가 이 값 이하면
      # 방향이 아직 애매하다고 보고 강조향을 잠시 제한
      ambiguous_gap_score_margin: 1.8

      # 애매한 상황에서 더 바깥쪽에 발견된 반대 gap의 영향력
      # 1.0은 동일 비중, 클수록 반대 방향을 더 일찍 반영
      ambiguous_gap_opposite_weight: 2.0

      # ============================================================
      # Localization 기반 reference path 조향 preference
      # path는 속도가 아니라 gap 후보의 조향 점수에만 반영됨
      # 최초 /global_path만 고정 사용하며 localization이 오래되면
      # 기존 LiDAR-only gap follower로 동작
      # ============================================================

      enable_path_guidance: true
      localization_topic: /odom
      localization_timeout: 0.5

      global_path_topic: /global_path
      # 한 번만 발행되는 latched path도 노드 시작 후 받을 수 있게 설정.
      # global_path publisher도 transient_local QoS를 제공해야 함.
      global_path_transient_local: true
      path_is_closed: true

      # 현재 위치에서 path 진행방향으로 이 거리 앞을 조향 기준으로 사용
      path_lookahead_distance: 1.2

      # 평소 gap 점수에 더할 path 방향 preference와,
      # path에서 벗어났을 때 복귀를 위해 더 강하게 적용할 preference
      path_guidance_weight: 1.0
      path_rejoin_weight: 2.5
      path_rejoin_distance: 0.5

      # 아래 LiDAR 안전조건을 모두 만족하는 후보에만 path 점수를 허용.
      # 따라서 global path 방향 앞이 막히면 preference는 적용되지 않음.
      path_candidate_min_clearance: 1.0
      path_candidate_min_score_ratio: 0.85
      path_candidate_min_clearance_ratio: 0.8

      # path 방향에서 멀어진 gap 후보의 preference가 감소하는 각도 폭
      path_alignment_sigma: 25.0
      # lookahead 목표가 차량 뒤쪽에 있으면 guidance를 사용하지 않음
      path_max_guidance_angle: 85.0
      # 교차 구간에서 차량 진행방향과 같은 path segment를 고르는 가중치
      path_heading_search_weight: 0.5

      # ============================================================
      # 조향 및 속도 튜닝
      # ============================================================

      # 차량의 실제 최대 조향각
      max_steering_angle: 45.0
      # 최근 조향 명령을 평균낼 개수
      steering_smooth_window: 3

      # 기본 목표 속도 = 안전거리 * speed_factor
      speed_factor: 0.4
      max_speed: 4.0 # 1.8
      # 안전 여유가 부족한 좁은 gap에서의 속도 제한
      narrow_gap_max_speed: 1.5 # 0.5
      # 비상이 아닐 때 유지하는 일반 주행 최저 속도.
      # 장애물 회피 중에도 충돌 궤적이 아니면 이 속도 아래로 내리지 않음.
      minimum_non_emergency_speed: 1.1
      # 실제 비상 충돌 궤적에서 완전히 정지하지 않고 유지할 최저 속도
      minimum_crawl_speed: 0.8 # 0.20

      # 안전거리가 start에서 end로 증가할 때 속도 배율을
      # 1.0에서 speed_increase_factor까지 증가
      speed_increase_start: 3.0
      speed_increase_end: 15.0
      speed_increase_factor: 1.5

      min_acceleration: 0.5
      max_acceleration: 6.0 # 4.0
      max_deceleration: 6.0

      # ============================================================
      # 차량 형상 및 Gap 안전 기준
      # 보통 차량 형상이 바뀌지 않으면 수정하지 않음
      # ============================================================

      friction: 0.75
      wheel_base: 0.324
      vehicle_radius: 0.18

      # base_link 기준 LiDAR 장착 위치 (0818 bag의 TF 기준)
      lidar_offset_x: 0.27
      lidar_offset_y: 0.0

      # 장애물 확장 시 vehicle_radius에 추가할 안전 여유
      gap_safety_margin: 0.1

      # 안전 여유를 적용한 gap이 이 거리보다 짧으면
      # vehicle_radius만 적용한 좁은 gap으로 다시 탐색
      # 좌우 gap 모두 주행 가능한지 판단하는 최소 거리로도 사용
      gap_fallback_distance: 0.4 # 0.5

      # 목표 방향 주변 ±각도에서 안전거리를 검사
      # 방향이 애매할 때 조향을 제한하는 각도로도 사용
      path_check_angle: 30.0

      # 0: 주변 최소 거리 / 1: 주변 최대 거리를 안전거리로 사용
      safety_level: 0.8

      # ============================================================
      # LiDAR 전처리
      # ============================================================

      # 인접 LiDAR 거리 차이가 이 값보다 크면 장애물 경계로 판단
      obstacle_edge_threshold: 0.15
      # 중앙값 필터의 창 크기
      scan_filter_window: 5
      # 전방 기준 사용할 LiDAR 범위: -90도 ~ +90도
      max_scan_angle: 90.0

      # ============================================================
      # 현재 조향 궤적 충돌검사
      # ============================================================

      # 이 거리 안에서 충돌이 예상되면 minimum_crawl_speed까지 감속
      emergency_stop_distance: 0.4

      # crawl 감속 전에 전체 조향 범위에서 안전한 회피 궤적을 먼저 탐색.
      # 아래 조건을 만족하는 조향이 있으면 crawl로 내리지 않고
      # 기존 거리 기반 목표 속도를 유지함.
      enable_steering_before_crawl: true
      # 대체 조향 방향의 최소 LiDAR 안전거리
      avoidance_min_clearance: 0.6
      # 대체 궤적에서 확보해야 하는 최소 충돌 없는 진행거리
      avoidance_collision_free_distance: 0.5
      # 대체 조향 탐색 각도 간격
      avoidance_steering_step: 2.0
      # 기존 gap 목표와 지나치게 다른 조향을 억제하는 점수 페널티
      avoidance_steering_change_penalty: 0.5

      # 충돌 여부를 검사할 진행 거리와 계산 간격
      trajectory_check_distance: 1.0
      trajectory_check_step: 0.05
      # 충돌검사 시 vehicle_radius에 추가할 안전 여유
      trajectory_safety_margin: 0.05

      # 첫 콜백의 가감속 계산에 사용할 시간
      initial_update_time: 0.05

      # ============================================================
      # ROS 입출력 및 디버그
      # ============================================================

      default_qos: 1
      debug: true

      lidar_scan_topic: /scan
      drive_topic: /drive_gf
      target_waypoint_topic: /gap_follow/target_waypoint
      debug_marker_topic: /gap_follow/debug_markers
      command_frame_id: base_link
