gap_follow:
  gap_follow:
    ros__parameters:
      friction: 0.75
      wheel_base: 0.324
      vehicle_radius: 0.18

      # 안전거리 * 기본 주행 속도
      speed_factor: 1.2
      max_speed: 5.5

      # LiDAR 거리 차이 -> 장애물 판단
      obstacle_edge_threshold: 0.15

      default_qos: 1

      # 1이면 평활화하지 않습니다.
      steering_smooth_window: 1

      # LiDAR 거리값 중앙값 필터의 창 크기
      scan_filter_window: 5

      # 안전거리 검사 각도
      path_check_angle: 3.0

      # 0이면 최소 거리, 1이면 최대 거리 선택
      safety_level: 0.10

      # 값이 클수록 center 방향 우선
      center_preference: 0.25

      speed_increase_start: 0.3
      speed_increase_end: 2.0
      speed_increase_factor: 2.8

      # 가까운 구간에서 적용할 가속도
      min_acceleration: 2.5
      # 넓은 구간에서 적용할 최대 가속도
      max_acceleration: 10.0
      # 속도를 줄일 때 적용할 최대 감속도
      max_deceleration: 8.0

      emergency_stop_distance: 0.4

      initial_update_time: 0.05

      debug: false

      lidar_scan_topic: /scan
      drive_topic: /gap_follow/drive
      target_waypoint_topic: /gap_follow/target_waypoint
      command_frame_id: base_link

      max_scan_angle: 90.0
