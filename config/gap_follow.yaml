gap_follow:
  gap_follow:
    ros__parameters:
      friction: 0.75
      wheel_base: 0.324
      vehicle_radius: 0.18
      # base_link 기준 LiDAR 장착 위치 (0818 bag의 TF 기준)
      lidar_offset_x: 0.27
      lidar_offset_y: 0.0

      # 목표점 선택 여유
      gap_safety_margin: 0.05

      # 안전 여유를 포함한 경로가 짧으면 실제 차량 반경으로 재탐색
      gap_fallback_distance: 0.8

      # 좁은 gap 통과 시 속도 범위
      narrow_gap_max_speed: 0.5
      minimum_crawl_speed: 0.20

      # 안전거리 * 기본 주행 속도
      speed_factor: 0.2
      max_speed: 1.8

      # LiDAR 거리 차이 -> 장애물 판단
      obstacle_edge_threshold: 0.15

      default_qos: 1

      # 조향 경향성 유지 n개 평균 조향
      steering_smooth_window: 3

      # LiDAR 거리값 중앙값 필터의 창 크기
      scan_filter_window: 5

      # 안전거리 검사 각도
      path_check_angle: 10.0

      # 0이면 최소 거리, 1이면 최대 거리 선택
      safety_level: 0.2

      # 0이면 깊이 우선, 1이면 주변이 넓게 열린 방향 우선
      gap_width_preference: 0.8
      # 이 거리보다 깊은 공간에는 목표점 점수를 더 주지 않음
      gap_score_distance_cap: 3.0

      # 기록 차량의 실제 조향 범위에 맞춘 명령/충돌검사 공통 한계
      max_steering_angle: 45.0

      speed_increase_start: 0.8
      speed_increase_end: 2.0
      speed_increase_factor: 1.5

      # 가까운 구간에서 적용할 가속도
      min_acceleration: 0.5
      # 넓은 구간에서 적용할 최대 가속도
      max_acceleration: 3.0
      # 속도를 줄일 때 적용할 최대 감속도
      max_deceleration: 6.0

      emergency_stop_distance: 0.3

      # 현재 조향 궤적을 따라 충돌 여부를 검사할 거리와 간격
      trajectory_check_distance: 0.7
      trajectory_check_step: 0.05
      # 차체 반경에 추가하는 궤적 충돌 검사 여유
      trajectory_safety_margin: 0.05

      initial_update_time: 0.05

      debug: true
     

      lidar_scan_topic: /scan
      drive_topic: /drive_gf
      target_waypoint_topic: /gap_follow/target_waypoint
      debug_marker_topic: /gap_follow/debug_markers
      command_frame_id: base_link

      max_scan_angle: 90.0
