gap_follow_ver2:
  gap_follow_ver2:
    ros__parameters:
      # ============================================================
      # 주행 방향 핵심 튜닝
      # 방향 선택 문제가 있을 때는 우선 이 네 값만 조정
      # ============================================================

      # 0: 깊게 열린 방향 우선 / 1: 주변까지 넓은 방향 우선
      gap_width_preference: 0.4

      # 이 거리보다 먼 LiDAR 값은 gap 점수에서 동일하게 취급
      gap_score_distance_cap: 5.0

      # 선택한 gap과 반대쪽 gap의 점수 차이가 이 값 이하면
      # 방향이 아직 애매하다고 보고 강조향을 잠시 제한
      ambiguous_gap_score_margin: 1.8

      # 애매한 상황에서 더 바깥쪽에 발견된 반대 gap의 영향력
      # 1.0은 동일 비중, 클수록 반대 방향을 더 일찍 반영
      ambiguous_gap_opposite_weight: 2.0

      # ============================================================
      # Localization 기반 reference path 조향 preference 및 목표 속도
      # x/y는 안전한 gap 후보의 조향 preference, z는 속도 프로파일.
      # 실제 CLEAR 목표속도 = z * path_speed_scale.
      # 최초 /global_path만 고정 사용하며 localization이 오래되면
      # 기존 LiDAR-only gap follower로 동작
      # ============================================================

      enable_path_guidance: true
      localization_topic: /odom
      # TTC·제동거리·속도별 회전반경 계산에 사용할 wheel odometry.
      # 타이어 calibration 전 wheel/controller 속도 단위를 실제 m/s로 변환:
      # actual_speed[m/s] = /odom_wheel.twist.linear.x * speed_calibration_factor
      speed_odometry_topic: /odom_wheel
      speed_calibration_factor: 2.6
      # localization pose와 wheel odometry에 공통 적용하는 유효시간
      odom_timeout: 0.3

      global_path_topic: /global_path
      # global path의 상대적인 속도 프로파일은 유지하면서 전체 속도를 낮춤.
      path_speed_scale: 0.70
      # 한 번만 발행되는 latched path도 노드 시작 후 받을 수 있게 설정.
      # global_path publisher도 transient_local QoS를 제공해야 함.
      global_path_transient_local: true
      path_is_closed: true

      # 현재 위치에서 path 진행방향으로 이 거리 앞을 조향 기준으로 사용
      path_lookahead_distance: 1.2

      # 평소 gap 점수에 더할 path 방향 preference와,
      # path에서 벗어났을 때 복귀를 위해 더 강하게 적용할 preference
      # 안전 gate를 통과한 후보끼리는 평상시에도 path 방향을 확실히 우선.
      # 0.6에서는 코너 장애물 앞에서 path +11~28도 대신 gap +2~6도가
      # 선택되어 실제 회피 조향이 약 0.7초 늦게 시작됐다.
      path_guidance_weight: 2.4
      path_rejoin_weight: 2.4
      path_rejoin_distance: 0.3


      # 아래 LiDAR 안전조건을 모두 만족하는 후보에만 path 점수를 허용.
      # 따라서 global path 방향 앞이 막히면 preference는 적용되지 않음.
      path_candidate_min_score_ratio: 0.85

      # path 방향에서 멀어진 gap 후보의 preference가 감소하는 각도 폭
      path_alignment_sigma: 35.0
      # lookahead 목표가 차량 뒤쪽에 있으면 guidance를 사용하지 않음
      path_max_guidance_angle: 85.0
      # 교차 구간에서 차량 진행방향과 같은 path segment를 고르는 가중치
      path_heading_search_weight: 0.5

      # ============================================================
      # 조향 및 속도 튜닝
      # 속도·가감속 값은 모두 보정된 실제 SI 단위.
      # 기존 wheel/controller 단위 값에 2.6을 곱해 주행 체감을 유지함.
      # ============================================================

      # 실차 servo bridge의 0.15~0.85 포화에 대응하는 명령 최대각.
      # 이보다 큰 45도 후보를 실제 차량이 낼 수 있다고 가정하지 않음.
      max_steering_angle: 38.57
      # 최근 조향 명령을 평균낼 개수
      steering_smooth_window: 3

      # global path 속도를 사용할 수 없을 때만 적용하는 fallback 목표 속도
      # = 안전거리 * speed_factor
      speed_factor: 0.78
      max_speed: 9.1
      # 안전 여유가 부족한 좁은 gap에서의 속도 제한
      narrow_gap_max_speed: 5.2
      # 비상이 아닐 때 유지하는 일반 주행 최저 속도.
      # 장애물 회피 중에도 충돌 궤적이 아니면 이 속도 아래로 내리지 않음.
      minimum_non_emergency_speed: 2.6
      # 실제 비상 충돌 궤적에서 완전히 정지하지 않고 유지할 최저 속도
      minimum_crawl_speed: 0.78

      # 안전거리가 start에서 end로 증가할 때 속도 배율을
      # 1.0에서 speed_increase_factor까지 증가
      speed_increase_start: 3.0
      speed_increase_end: 15.0
      speed_increase_factor: 1.5

      min_acceleration: 1.3
      # 짧은 CLEAR 구간에서 path 속도로 튀었다가 다음 회피 전에
      # 물리 속도가 과도하게 높아지는 것을 제한. 최고속도 자체는 유지함.
      max_acceleration: 5.2
      # TTC·제동거리 계산에 사용하는 실제 달성 가능한 감속도.
      # 3 m 탐지만으로 감속하지 않고, 안전한 회피 후보가 없을 때만 사용.
      normal_deceleration: 5.0
      # TTC가 steering_transition_time 이하인 비상상황 감속도
      max_deceleration: 15.6

      # ============================================================
      # 차량 형상 및 Gap 안전 기준
      # 보통 차량 형상이 바뀌지 않으면 수정하지 않음
      # ============================================================

      # 실차 bag/시뮬 모델의 저속 마찰계수. 3.5~4.5 m/s에서
      # 코드가 고속 계수(0.837배)로 부드럽게 낮춰 곡률 상한에 적용함.
      friction: 0.78
      # 회전반경은 test_13~test_29 전체 bag에서 얻은 속도×명령각
      # curvature lookup을 코드에서 보간한다. 기존 bicycle gain 파라미터는
      # 고속 회전량을 최대 약 2배 크게 예측해 제거함.
      # base_link 중심 직사각형 차량 footprint
      vehicle_width: 0.36
      vehicle_length: 0.55

      # base_link 기준 LiDAR 장착 위치 (0818 bag의 TF 기준)
      lidar_offset_x: 0.27
      lidar_offset_y: 0.0

      # 장애물 확장 시 차량 반폭에 추가할 안전 여유
      gap_safety_margin: 0.3

      # 안전 여유를 적용한 gap이 이 거리보다 짧으면
      # 차량 반폭만 적용한 좁은 gap으로 다시 탐색
      # 좌우 gap 모두 주행 가능한지 판단하는 최소 거리로도 사용
      gap_fallback_distance: 0.4 # 0.5

      # 목표 방향 주변 ±각도에서 안전거리를 검사
      # 방향이 애매할 때 조향을 제한하는 각도로도 사용
      path_check_angle: 45.0

      # 0: 주변 최소 거리 / 1: 주변 최대 거리를 안전거리로 사용
      safety_level: 0.7
      # path preference 및 회피 조향의 통과 여부만 더 보수적으로 검사.
      # gap 점수와 속도 계산에는 위 safety_level을 계속 사용함.
      candidate_safety_level: 0.4
      # path preference와 대체 회피 조향에 공통 적용할 최소 안전거리
      candidate_min_clearance: 0.5

      # ============================================================
      # LiDAR 전처리
      # ============================================================

      # 인접 LiDAR 거리 차이가 이 값보다 크면 장애물 경계로 판단
      obstacle_edge_threshold: 0.15
      # 중앙값 필터의 창 크기
      scan_filter_window: 5
      # 전방 기준 사용할 LiDAR 범위: -90도 ~ +90도
      max_scan_angle: 90.0

      # ============================================================
      # 현재 조향 궤적 충돌검사
      # ============================================================

      # crawl 감속 전에 전체 조향 범위에서 안전한 회피 궤적을 먼저 탐색.
      # 아래 조건을 만족하는 조향이 있으면 crawl로 내리지 않고
      # 기존 거리 기반 목표 속도를 유지함.
      # 대체 조향 탐색 각도 간격
      avoidance_steering_step: 1.0
      # 기존 gap 목표·현재 조향과 지나치게 다른 후보를 약하게 억제하는
      # tie-break preference. 크게 올리면 곡선 장애물에서 여유가 작은 조향을
      # 고르므로 안전 clearance 점수가 우선하도록 유지한다.
      avoidance_steering_change_penalty: 0.3
      # 지속적인 좌/우 방향 latch는 사용하지 않는다. 매 LiDAR scan마다
      # 양쪽의 충돌 없는 후보를 다시 비교하고, 둘 다 안전할 때 path 쪽을
      # 선호한다. 따라서 path가 반대로 꺾이면 이전 회피 부호를 강제하지 않음.

      # BRAKE/STOP 및 속도별 궤적 검증에 사용할 근거리 위험 horizon.
      # 조향 선행 탐지는 아래 steering_preview_distance로 분리되어 있어
      # 멀리 장애물이 보인다는 이유만으로 이 값의 감속 판단이 켜지지 않음.
      obstacle_detection_distance: 3.0
      # path/현재 목표 궤적의 blocker를 미리 찾아 조향 회피를 시작하는 거리.
      # 속도 cap에는 직접 사용하지 않으며, 같은 blocker를 완전히 피하는
      # 후보인지 검사하는 용도로만 사용함.
      steering_preview_distance: 4.5
      # 즉시 충돌 및 후보 검사의 기본 거리. 고속에서는 최소한
      # 실제속도 * 조향응답시간 + 차량 앞부분까지 자동으로 늘어나며,
      # 조기 조향 후보는 별도로 약 2.38 m의 local maneuver를 검사한 뒤
      # 조향 preview에서 충돌을 만든 동일 blocker를 완전히 비켜가야 함.
      # 감속은 남은 충돌점이 실제 제동거리 안에 있을 때만 시작함.
      trajectory_check_distance: 1.5
      trajectory_check_step: 0.05
      # 충돌검사 시 직사각형의 전후·좌우에 추가할 안전 여유
      trajectory_safety_margin: 0.05

      # 최종 차량 명령을 현재 조향으로 사용하고 목표 조향까지
      # 점진적으로 변하는 단일 전환 궤적을 검사함.
      steering_feedback_topic: /ackermann_cmd
      steering_transition_time: 0.20

      # 첫 콜백의 가감속 계산에 사용할 시간
      initial_update_time: 0.05

      # ============================================================
      # ROS 입출력 및 디버그
      # ============================================================

      default_qos: 1
      debug: true

      lidar_scan_topic: /scan
      drive_topic: /drive_gf2
      target_waypoint_topic: /gap_follow_ver2/target_waypoint
      debug_marker_topic: /gap_follow_ver2/debug_markers
      command_frame_id: base_link
